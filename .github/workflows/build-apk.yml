name: Build ToobitPulse Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ToobitPulse-debug.apk

      - name: Upload ToobitPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: ToobitPulse-Android-APK
          path: ToobitPulse-debug.apk
          retention-days: 30
